[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent_hq"
version = "0.1.0"
description = "Configuration-driven task engine for autonomous engineering work on GitHub Actions"
requires-python = ">=3.11"
dependencies = [
    "PyYAML",
    "jsonschema",
    "requests",
]

[project.optional-dependencies]
# ruff pinned to a minor: its DEFAULT rule set grows between minors, so an
# unpinned `ruff` turned every CI run into a lint-config change nobody made
# (0.16 added 48 findings to a green tree). Bump deliberately, fix the new
# findings in that same change.
dev = ["pytest", "ruff==0.16.*"]

[project.scripts]
agent-hq = "engine.cli:main"

[tool.setuptools]
packages = ["engine", "engine.adapters", "schemas"]

[tool.setuptools.package-data]
schemas = ["*.json"]

[tool.ruff]
line-length = 100
