[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent_hq"
version = "0.1.0"
description = "Configuration-driven task engine for autonomous engineering work on GitHub Actions"
requires-python = ">=3.11"
dependencies = [
    "PyYAML",
    "jsonschema",
    "requests",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
agent-hq = "engine.cli:main"

[tool.setuptools]
packages = ["engine", "engine.adapters"]

[tool.ruff]
line-length = 100
