# Component port bindings (§6). Pilot placeholder values only.
tracker:
  adapter: github-issues
# Copilot-billed Claude by default (see docs/architecture.md PD-5); swap
# `adapter` to `claude-code-headless` for the direct-Anthropic-key fallback --
# one line each, no other change needed (PA-2).
executor:
  adapter: copilot-cli
  settings:
    model: claude-sonnet-4.5
agent-session:
  adapter: copilot-cli
  settings:
    model: claude-sonnet-4.5
messaging:
  adapter: github-comment
# Orchestration approvals default to an authorized issue-comment gate on the
# engine issue (see docs/ports/gate.md); pr-review remains available for a
# task that binds to it explicitly (code-review approvals on a work-repo PR).
gate:
  adapter: github-issue-comment
  named:
    spec-approval: github-issue-comment
label_overrides:
  - "hq:executor="
