# Staged: activated with the arch-plan -> arch-approval chain (its in-edges);
# see arch-plan's header for the activation edit. In the minimal route spec
# fans out to implement directly.
id: breakdown
version: 1
description: Break the plan into ordered, per-repo implementation tasks with acceptance-criteria coverage.
trigger: enqueued_by
skills:
  - prompts/breakdown.md
outputs:
  artifacts:
    - specs/{ticket}/tasks.md
handoff:
  allowed:
    - implement
  # Fan-out point: the pilot's two configured repos (config/repos.yml) mean
  # a two-repo ticket needs one `implement` handoff per affected repo.
  max: 2
budget:
  max_cost_usd: 5
  max_runtime_min: 30
  retries: 2
