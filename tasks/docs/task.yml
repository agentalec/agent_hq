# P1: sits between qa and finalize in the route. No activation edit needed any
# more -- any task in the library is queueable -- so what is missing is qa's
# prompt queueing `docs` ahead of `finalize` instead of `finalize` alone.
# Docs destination is per repos.yml docs role/destination (requirements §12
# open question -- until answered, write under the target repo's own docs/
# dir).
id: docs
version: 1
description: Update user/developer docs for the change and record what changed where.
trigger: enqueued_by
context:
  - constitution
  - specs/{ticket}/*
skills:
  - prompts/docs.md
  - checklists/docs-drift.md
outputs:
  artifacts:
    - specs/{ticket}/docs.md
budget:
  max_cost_usd: 5
  max_runtime_min: 30
  retries: 2
