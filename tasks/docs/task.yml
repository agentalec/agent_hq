# P1: activation = insert between qa and finalize (qa already hands off here
# via handoff.allowed once qa is activated); handoff.allowed below still
# targets finalize directly since qa isn't wired into the live chain yet.
# Docs destination is per repos.yml docs role/destination (requirements §12
# open question -- until answered, write under the target repo's own docs/
# dir).
id: docs
version: 1
description: Update user/developer docs for the change and record what changed where.
trigger: enqueued_by
context:
  - constitution
  - specs/{ticket}/*
skills:
  - prompts/docs.md
  - checklists/docs-drift.md
outputs:
  artifacts:
    - specs/{ticket}/docs.md
handoff:
  allowed:
    - finalize
  max: 1
budget:
  max_cost_usd: 5
  max_runtime_min: 30
  retries: 2
