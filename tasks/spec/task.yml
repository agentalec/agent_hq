id: spec
version: 1
description: Author the specification for the ticket.
trigger: enqueued_by
context:
  - constitution
  - specs/{ticket}/*
skills:
  - prompts/spec.md
  - checklists/spec-quality.md
outputs:
  artifacts:
    - specs/{ticket}/spec.md
gates:
  post:
    - approvers: product-owners
      adapter: spec-approval
      timeout_working_hours: 48
      # The gate is declared but decided by the engine: specs flow straight to
      # `implement` without waiting for a product owner. The approval comment
      # and its `gate.decided` event still record that the checkpoint exists,
      # so staffing it later is this one line. Merge remains human either way.
      auto_approve: true
handoff:
  allowed:
    - implement
  # Fan-out point in the minimal route: one implement handoff per affected
  # repo (config/repos.yml lists three).
  max: 3
budget:
  max_cost_usd: 5
  max_runtime_min: 30
  retries: 2
