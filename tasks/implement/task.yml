id: implement
version: 1
description: Implement the ticket per specs/{ticket}/spec.md, committing as you go.
trigger: enqueued_by
skills:
  - prompts/implement.md
opens_pr: true
outputs:
  artifacts: []
handoff:
  allowed:
    - finalize
  max: 1
budget:
  max_cost_usd: 15
  max_runtime_min: 90
  retries: 2
