# Staged: no activation edit needed any more -- any task in the library is
# queueable, so this runs as soon as some run's control.json queues it (e.g.
# clinical's prompt, or a triage entry). What is still missing is a prompt that
# tells a run to queue it.
# (the minimal route hands spec straight to implement).
id: arch-plan
version: 1
description: Produce an implementation plan and classify the ticket as crud or beyond-crud.
trigger: enqueued_by
context:
  - constitution
  - specs/{ticket}/*
skills:
  - prompts/arch-plan.md
outputs:
  artifacts:
    - specs/{ticket}/plan.md
    - specs/{ticket}/classification.json
budget:
  max_cost_usd: 5
  max_runtime_min: 30
  retries: 2
