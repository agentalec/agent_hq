# Wired: `review` hands off here once no blockers remain; `qa` hands off to
# `finalize`. It stands the app up with the repo's own tooling inside the
# devcontainer (Node 22 + docker-in-docker) -- the compose-based `qa-env`
# adapter stays deferred (docs/roadmap.md), so nothing here binds to it.
# `screenshots/` is a DIRECTORY artifact (trailing slash): its contents cannot
# be named in advance, so the engine collects whatever is there, zero or more.
# They are ledger artifacts like every other output -- kept out of the work
# repo, which is for product code -- and the engine rewrites qa.md's relative
# image links to their ledger URLs when it posts qa.md to the PR.
id: qa
version: 1
description: Verify the change in a running app and reflect screenshots onto the PR.
trigger: enqueued_by
context:
  - constitution
  - specs/{ticket}/*
skills:
  - prompts/qa.md
  - checklists/qa-coverage.md
# qa verifies; it never edits the product. Everything it leaves in the
# worktree is scratch, so the engine discards its work patch outright rather
# than trusting the prompt's "put scratch in .agent-hq/" to hold.
writes_code: false
outputs:
  artifacts:
    - specs/{ticket}/qa.md
    - specs/{ticket}/screenshots/
handoff:
  allowed:
    - finalize
  max: 1
budget:
  max_cost_usd: 10
  max_runtime_min: 60
  retries: 1
