# On the pilot route: `review`'s prompt queues it once no blockers remain, and
# its own prompt queues `finalize`. It stands the app up with the repo's own tooling inside the
# devcontainer (Node 22 + docker-in-docker) -- the compose-based `qa-env`
# adapter stays deferred (docs/roadmap.md), so nothing here binds to it.
# `videos/` and `screenshots/` are DIRECTORY artifacts (trailing slash): their
# contents cannot be named in advance, so the engine collects whatever is
# there, zero or more. They are ledger artifacts like every other output --
# kept out of the work repo, which is for product code -- and the engine
# rewrites qa.md's relative media links to their ledger URLs when it posts
# qa.md to the PR (WebM + sibling collect-derived GIF → collapsed details
# preview). `qa-report.json` is required; collect validates honesty
# (filename convention, no task-id special case). Pass still requires WebM.
id: qa
version: 1
description: Verify the change in a running app with live-flow video evidence and reflect it onto the PR.
trigger: enqueued_by
context:
  - constitution
  - specs/{ticket}/*
skills:
  - prompts/qa.md
  - checklists/qa-coverage.md
# qa verifies; it never edits the product. Everything it leaves in the
# worktree is scratch, so the engine discards its work patch outright rather
# than trusting the prompt's "put scratch in .agent-hq/" to hold.
writes_code: false
outputs:
  artifacts:
    - specs/{ticket}/qa.md
    - specs/{ticket}/qa-report.json
    - specs/{ticket}/videos/
    - specs/{ticket}/screenshots/
budget:
  max_cost_usd: 10
  max_runtime_min: 60
  retries: 1
