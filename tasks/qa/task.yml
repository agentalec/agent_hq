# Wired: `review` hands off here once no blockers remain; `qa` hands off to
# `finalize`. It stands the app up with the repo's own tooling inside the
# devcontainer (Node 22 + docker-in-docker) -- the compose-based `qa-env`
# adapter stays deferred (docs/roadmap.md), so nothing here binds to it.
# Screenshots are work-repo files, not ledger artifacts: they land in this
# run's own patch, and the engine rewrites qa.md's relative image links to raw
# URLs on that commit when it posts qa.md to the PR.
id: qa
version: 1
description: Verify the change in a running app and reflect screenshots onto the PR.
trigger: enqueued_by
context:
  - constitution
  - specs/{ticket}/*
skills:
  - prompts/qa.md
  - checklists/qa-coverage.md
outputs:
  artifacts:
    - specs/{ticket}/qa.md
handoff:
  allowed:
    - finalize
  max: 1
budget:
  max_cost_usd: 10
  max_runtime_min: 60
  retries: 1
