# P1: needs the compose-based qa-env adapter (see docs/roadmap.md; not built in P0).
# Activation: point tasks/review/task.yml handoff.allowed at qa (review still
# hands off to finalize until then).
id: qa
version: 1
description: Stand up the target stack and run integration tests against the acceptance criteria.
trigger: enqueued_by
context:
  - constitution
  - specs/{ticket}/*
skills:
  - prompts/qa.md
  - checklists/qa-coverage.md
outputs:
  artifacts:
    - specs/{ticket}/qa.md
handoff:
  allowed:
    - docs
  max: 1
budget:
  max_cost_usd: 10
  max_runtime_min: 60
  retries: 1
