id: review
version: 1
description: Review the implementation against the spec; loop back to implement or finish.
trigger: enqueued_by
context:
  - constitution
  - specs/{ticket}/*
skills:
  - prompts/review.md
tools:
  - Read
  - Grep
  - Glob
  - Write
outputs:
  artifacts:
    - specs/{ticket}/review.md
handoff:
  allowed:
    - implement
    - qa
  max: 1
budget:
  max_cost_usd: 5
  max_runtime_min: 30
  retries: 2
