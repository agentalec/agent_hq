name: Pages

# The site is static source, not a render of state: the page fetches
# dashboard.json off the state branch at view time. So this deploys when the
# dashboard changes, never on a schedule -- state moving is not a reason to
# rebuild (docs/dashboard-design-requirements.md §4.5).
on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# No AGENT_HQ_TOKEN here any more: nothing in this job reads the state
# branch, so the deploy needs no credential at all.

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # No state checkout and no build step: the deploy must never read the
      # state branch, and there is nothing to compile.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dashboard
      - id: deployment
        uses: actions/deploy-pages@v4
