name: Intake

on:
  issues:
    types: [labeled, opened]

permissions:
  issues: write
  contents: write

# Keyed per issue, not globally: one issue's `opened` + `labeled` deliveries
# still serialize (they are the same intake, and it is idempotent), but two
# different issues never queue behind each other. A shared group kept a single
# pending slot, so filing several issues at once cancelled all but the last --
# and unlike a run.yml cancellation, a cancelled intake is lost outright: no
# ticket exists yet for the sweep to re-drive.
concurrency:
  group: "intake-${{ github.event.issue.number }}"
  cancel-in-progress: false

env:
  AGENT_HQ_TOKEN: ${{ secrets.AGENT_HQ_TOKEN }}
  AGENT_HQ_ENGINE_REPO: ${{ github.repository }}

jobs:
  intake:
    # The engine labels this issue itself -- `set_status_label` writes one of
    # `engine.engine.STATUS_LABELS` on every status transition -- and it labels
    # with AGENT_HQ_TOKEN, a PAT, which unlike the default GITHUB_TOKEN DOES
    # re-trigger workflows. So the engine's own bookkeeping came back as an
    # intake event: a `spec` run whose queue drained blocked the ticket, the
    # block wrote `hq:blocked`, this workflow woke, and `intake_ticket` found
    # `hq:intake` still on the issue with every run terminal -- its definition
    # of "a human relabelled this, re-admit it" -- so it cleared the block and
    # re-enqueued `spec`. Ticket #20 ran that circuit four times in 17 minutes
    # before an unrelated state-push race broke it; nothing in the engine
    # stopped it, and `loop_guard.max_runs` was 17 runs away.
    #
    # A status label is a VIEW of state, never the source of it, so an event
    # announcing one can never be news to intake. Every other label -- a human
    # adding `hq:intake`, `frontend`, `hq:public-safe` -- still wakes it, which
    # is what keeps relabel-to-re-admit working. The list is pinned against
    # STATUS_LABELS by `tests/test_workflows.py`.
    if: >-
      github.event.action != 'labeled' || !contains(fromJSON('["hq:active","hq:waiting-gate","hq:awaiting-merge","hq:blocked","hq:done"]'), github.event.label.name)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bash scripts/checkout-state.sh
      - run: >
          agent-hq intake
          --issue "${{ github.event.issue.number }}"
          --event-key "${{ github.event.issue.number }}:${{ github.event.action }}:${{ github.event.issue.updated_at }}"
          --state ./_state
      - name: Wake the dispatcher
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer $AGENT_HQ_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/dispatches" \
            -d "{\"event_type\":\"agent-hq-dispatch\",\"client_payload\":{\"issue\":\"${{ github.event.issue.number }}\"}}" || true
      - name: Refresh the dashboard
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer $AGENT_HQ_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/pages.yml/dispatches" \
            -d '{"ref":"main"}' || true
