name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          dev: "true"
      # Match run.yml collect: QA webm→gif smoke needs ffmpeg on PATH.
      # Production collect already installs it; unit CI did not, so
      # test_webm_to_gif_roundtrip_with_ffmpeg FileNotFoundError'd.
      - name: Install ffmpeg (QA webm→gif smoke)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: ruff check .
      - run: pytest -q
      - run: agent-hq config validate
      - run: agent-hq tasks validate
      - name: actionlint
        run: docker run --rm -v "$PWD":/repo -w /repo rhysd/actionlint:1.7.7 -color
